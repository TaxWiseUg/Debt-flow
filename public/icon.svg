<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#4338ca" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000" flood-opacity="0.35" />
    </filter>
  </defs>
  
  <!-- Base Squircle -->
  <rect x="32" y="32" width="448" height="448" rx="112" fill="url(#bgGrad)" filter="url(#shadow)" />
  
  <!-- Subtle glass inner glow -->
  <rect x="34" y="34" width="444" height="444" rx="110" fill="none" stroke="white" stroke-opacity="0.15" stroke-width="4" />
  
  <!-- Document & Flow Glyphs -->
  <g transform="translate(112, 104)">
    <!-- Back card / ledger sheet -->
    <rect x="48" y="24" width="200" height="264" rx="28" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.2" stroke-width="6" />
    
    <!-- Main front card -->
    <rect x="24" y="56" width="232" height="248" rx="28" fill="#ffffff" fill-opacity="0.15" stroke="#ffffff" stroke-opacity="0.4" stroke-width="6" />
    
    <!-- Header stripe -->
    <rect x="56" y="96" width="96" height="20" rx="10" fill="url(#accentGrad)" />
    
    <!-- Ledger balance lines -->
    <rect x="56" y="136" width="168" height="14" rx="7" fill="#ffffff" fill-opacity="0.8" />
    <rect x="56" y="168" width="128" height="14" rx="7" fill="#ffffff" fill-opacity="0.5" />
    <rect x="56" y="200" width="144" height="14" rx="7" fill="#ffffff" fill-opacity="0.5" />
    
    <!-- Checkmark badge -->
    <circle cx="216" cy="244" r="38" fill="#10b981" stroke="#ffffff" stroke-width="6" />
    <path d="M202 244 L212 254 L232 234" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
