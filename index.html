<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <script>
      (function () {
        // Prevent Vite HMR WebSocket connection failure in proxy/iframe environment
        const OrigWebSocket = window.WebSocket;
        if (OrigWebSocket) {
          window.WebSocket = function (url, protocols) {
            const isViteHmr =
              protocols === 'vite-hmr' ||
              (Array.isArray(protocols) && protocols.includes('vite-hmr')) ||
              (typeof url === 'string' && (url.includes('/@vite') || url.includes(':3000') || url.includes('run.app')));

            if (isViteHmr) {
              const target = new EventTarget();
              target.send = function () {};
              target.close = function () {};
              target.readyState = 1; // OPEN
              target.url = url;
              target.protocol = 'vite-hmr';
              target.binaryType = 'blob';
              target.bufferedAmount = 0;
              target.onopen = null;
              target.onclose = null;
              target.onerror = null;
              target.onmessage = null;
              setTimeout(() => {
                if (typeof target.onopen === 'function') target.onopen(new Event('open'));
                target.dispatchEvent(new Event('open'));
              }, 10);
              return target;
            }
            return new OrigWebSocket(url, protocols);
          };
          window.WebSocket.prototype = OrigWebSocket.prototype;
          window.WebSocket.CONNECTING = 0;
          window.WebSocket.OPEN = 1;
          window.WebSocket.CLOSING = 2;
          window.WebSocket.CLOSED = 3;
        }

        window.addEventListener('error', function (e) {
          if (e && e.message && e.message.includes('WebSocket')) {
            e.stopImmediatePropagation();
            e.preventDefault();
          }
        }, true);

        const _origErr = console.error;
        console.error = function (...args) {
          if (args[0] && typeof args[0] === 'string' && (args[0].includes('[vite]') || args[0].includes('WebSocket'))) {
            return;
          }
          _origErr.apply(console, args);
        };
      })();
    </script>
    <title>NexTone - Client Orders, Invoicing & Debt Tracker</title>
    <meta name="description" content="NexTone printing, branding, client work orders, multi-item invoicing, catalog pricing, and installment debt tracking in Ugandan Shillings." />
